<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KENNENTH TOOLBOX</title>
<meta name="description" content="A collection of little tools built to make life easier.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23A64AC9'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='%23FCCD04'>K</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#tools">Skip to tools</a>
<header class="hero">
  <div class="bar"><span><i class="dot"></i> SYSTEM ONLINE</span><span>SYSTEM 01</span></div>
  <div class="hero-body">
    <p class="tag">UTILITY INDEX</p>
    <h1>KENNENTH<br>TOOLBOX</h1>
    <p class="sub">Small tools. Big convenience.</p>
  </div>
</header>
<main>
  <section class="controls" aria-label="Search and filter">
    <div class="search">
      <label for="q" class="vh">Search tools</label>
      <span aria-hidden="true">&gt;_</span>
      <input id="q" type="search" placeholder="Search tools..." autocomplete="off">
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    <p class="count" id="count" aria-live="polite"></p>
  </section>
  <section id="recent-wrap" class="recent" hidden aria-labelledby="rh">
    <h2 id="rh">Recently Used</h2>
    <div class="chips" id="recent"></div>
  </section>
  <section id="tools" aria-label="Tool collection">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <p class="big">NO TOOL FOUND</p>
      <p>Try another search term, or pick a different category.</p>
    </div>
  </section>
</main>
<footer>
  <div><strong>KENNENTH TOOLBOX</strong><br>Built for convenience, curiosity, and everyday problems.</div>
  <div>© 2026 Kennenth Hartono · <a href="https://github.com/KennenthHartono" target="_blank" rel="noopener">GitHub</a></div>
</footer>
<script src="js/tools.js"></script>
<script src="js/app.js"></script>
</body>
</html>
